name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted","lab","public-isolated"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # GitHub-hosted (fork PRs): setup-python, same version as the lab pin.
      - if: runner.environment == 'github-hosted'
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      # Lab: preinstalled pinned Python, red unless version and libpython match. Never downloads.
      - if: runner.environment != 'github-hosted'
        uses: ./.github/actions/ci-python
      - name: Check repository contracts
        run: python3 scripts/check_repo.py
      - name: Run tests
        run: python3 -m unittest discover -s tests -v

  skill-discovery:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted","lab","public-isolated"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # skills CLI needs Node >= 22.20; the lab host ships Node 18.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover Skill with skills CLI
        run: |
          set -euo pipefail
          npx --yes skills add . --list | tee skills-list.txt
          grep -q "i-have-adhd-zh-tw" skills-list.txt || {
            echo "::error::skills CLI did not discover i-have-adhd-zh-tw"
            exit 1
          }
