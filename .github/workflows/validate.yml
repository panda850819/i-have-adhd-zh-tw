name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check repository contracts
        run: python3 scripts/check_repo.py
      - name: Run tests
        run: python3 -m unittest discover -s tests -v

  skill-discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Discover Skill with skills CLI
        run: |
          npx --yes skills add . --list | tee skills-list.txt
          grep -q "i-have-adhd-zh-tw" skills-list.txt || {
            echo "::error::skills CLI did not discover i-have-adhd-zh-tw"
            exit 1
          }
